name: Fast DRM Server Test
on: workflow_dispatch

jobs:
  run-test:
    runs-on: ubuntu-22.04 # 🟢 Purana stable server taake koi hang na ho
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Display & Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install

      - name: Run DRM Video Test
        run: xvfb-run node test-drm.js
